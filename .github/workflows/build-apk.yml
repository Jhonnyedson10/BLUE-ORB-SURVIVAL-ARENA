name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      - name: Buildozer
        run: |
          pip install buildozer==1.5.0 "cython<3" virtualenv
          buildozer -v android debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BlueOrb-APK
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/dists/*/build/outputs/logs
          if-no-files-found: warn
